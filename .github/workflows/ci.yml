name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ALLOW_LIVE: "false"

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff format --check app tests
      - run: uv run ruff check app tests
      - run: uv run mypy app tests
      - run: uv run python -m pytest -q -m "not integration"
      - run: uv run python -m pytest -q -m integration

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run format:check
      - run: npm run frontend:lint
      - run: npm run frontend:typecheck
      - run: npm run frontend:test
      - run: npm run frontend:build

  offline-e2e:
    name: Offline fixture E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm ci --prefix frontend
      - run: npm run frontend:build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run e2e

  dependency-audit:
    name: High-severity dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: uv sync --frozen --extra dev
      - run: uv run pip-audit
      - run: npm audit --audit-level=high
      - run: npm audit --prefix frontend --audit-level=high
