name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ALLOW_LIVE: "false"

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: .venv/bin/ruff format --check app tests
      - run: .venv/bin/ruff check app tests
      - run: .venv/bin/mypy app tests
      - run: .venv/bin/python -m pytest -q -m "not integration"
      - run: .venv/bin/python -m pytest -q -m integration

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run format:check
      - run: npm run frontend:lint
      - run: npm run frontend:typecheck
      - run: npm run frontend:test
      - run: npm run frontend:build

  offline-e2e:
    name: Offline fixture E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: npm ci --prefix frontend
      - run: npm run frontend:build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run e2e

  dependency-audit:
    name: High-severity dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[dev]'
      - run: .venv/bin/python -m pip_audit
      - run: npm audit --audit-level=high
      - run: npm audit --prefix frontend --audit-level=high
