name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install repository tooling
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Audit repository tooling
        run: npm audit --audit-level=high

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python quality tooling
        run: python -m pip install mypy==1.20.2 pytest==9.0.3 ruff==0.15.12

      - name: Lint Python
        run: python -m ruff check app tests

      - name: Type-check Python
        run: python -m mypy app tests

      - name: Test Python
        run: python -m pytest -q
