[project]
name = "heat-aware-tourism-guide"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "astral==3.2",
    "fastapi==0.141.1",
    "pyproj==3.7.2",
    "shapely==2.1.2",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = ["httpx2==2.12.0"]
dev = [
    "httpx2==2.12.0",
    "mypy==1.17.1",
    "pip-audit==2.9.0",
    "pytest==9.0.3",
    "ruff==0.12.12",
]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: fixture-backed tests that cross application boundaries",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "app.api"
disable_error_code = ["misc"]
