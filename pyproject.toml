[project]
name = "heat-aware-tourism-guide"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "pyproj==3.7.2",
    "shapely==2.1.2",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = ["httpx2==2.12.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = "app.api"
disable_error_code = ["untyped-decorator"]
